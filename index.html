<title>Unpaid Payments Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<style>
  :root {
    --sidebar-bg: #1c1c1e;
    --sidebar-fg: #a1a1aa;
    --sidebar-fg-active: #ffffff;
    --sidebar-border: #2a2a2d;
    --sidebar-hover: #2a2a2d;
    --sidebar-active-bg: #3a3a3d;
    --sidebar-width: 220px;

    --main-bg: #f4f4f5;
    --topbar-bg: #ffffff;
    --topbar-border: #e4e4e7;

    --card-bg: #ffffff;
    --card-border: #e4e4e7;
    --card-shadow: 0 1px 2px rgba(0,0,0,0.06);

    --fg: #18181b;
    --fg-2: #71717a;
    --fg-3: #a1a1aa;

    --accent: #2563eb;
    --accent-fg: #ffffff;

    --critical-bg: #fef2f2;
    --critical-border: #fca5a5;
    --critical-label: #dc2626;
    --critical-badge-bg: #fee2e2;

    --major-bg: #fff7ed;
    --major-border: #fed7aa;
    --major-label: #ea580c;
    --major-badge-bg: #ffedd5;

    --minor-bg: #ffffff;
    --minor-label: #71717a;
    --minor-badge-bg: #f4f4f5;

    --paid-label: #16a34a;
    --paid-badge-bg: #dcfce7;

    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sidebar-bg: #111113;
      --sidebar-fg: #71717a;
      --sidebar-fg-active: #fafafa;
      --sidebar-border: #1f1f22;
      --sidebar-hover: #1a1a1d;
      --sidebar-active-bg: #27272a;

      --main-bg: #18181b;
      --topbar-bg: #1c1c1e;
      --topbar-border: #27272a;

      --card-bg: #1c1c1e;
      --card-border: #27272a;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.3);

      --fg: #fafafa;
      --fg-2: #a1a1aa;
      --fg-3: #52525b;

      --accent: #3b82f6;
      --accent-fg: #ffffff;

      --critical-bg: #1c1018;
      --critical-border: #7f1d1d;
      --critical-label: #f87171;
      --critical-badge-bg: #450a0a;

      --major-bg: #1c1409;
      --major-border: #7c2d12;
      --major-label: #fb923c;
      --major-badge-bg: #431407;

      --minor-bg: #1c1c1e;
      --minor-label: #71717a;
      --minor-badge-bg: #27272a;

      --paid-label: #4ade80;
      --paid-badge-bg: #052e16;

      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --sidebar-bg: #111113;
    --sidebar-fg: #71717a;
    --sidebar-fg-active: #fafafa;
    --sidebar-border: #1f1f22;
    --sidebar-hover: #1a1a1d;
    --sidebar-active-bg: #27272a;

    --main-bg: #18181b;
    --topbar-bg: #1c1c1e;
    --topbar-border: #27272a;

    --card-bg: #1c1c1e;
    --card-border: #27272a;
    --card-shadow: 0 1px 3px rgba(0,0,0,0.3);

    --fg: #fafafa;
    --fg-2: #a1a1aa;
    --fg-3: #52525b;

    --accent: #3b82f6;
    --accent-fg: #ffffff;

    --critical-bg: #1c1018;
    --critical-border: #7f1d1d;
    --critical-label: #f87171;
    --critical-badge-bg: #450a0a;

    --major-bg: #1c1409;
    --major-border: #7c2d12;
    --major-label: #fb923c;
    --major-badge-bg: #431407;

    --minor-bg: #1c1c1e;
    --minor-label: #71717a;
    --minor-badge-bg: #27272a;

    --paid-label: #4ade80;
    --paid-badge-bg: #052e16;

    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--sidebar-bg);
    color: var(--fg);
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    padding-left: max(0px, env(safe-area-inset-left, 0px));
    padding-right: max(0px, env(safe-area-inset-right, 0px));
  }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--sidebar-width);
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--sidebar-border);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }

  .sidebar-brand {
    padding: 20px 16px 16px;
    border-bottom: 1px solid var(--sidebar-border);
  }

  .sidebar-brand-icon {
    width: 28px;
    height: 28px;
    background: var(--accent);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
  }

  .sidebar-brand-icon svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .sidebar-brand-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--sidebar-fg-active);
    letter-spacing: -0.01em;
    line-height: 1.3;
  }

  .sidebar-brand-sub {
    font-size: 11px;
    color: var(--sidebar-fg);
    margin-top: 2px;
  }

  .sidebar-nav {
    padding: 10px 8px;
    flex: 1;
  }

  .nav-section-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--sidebar-fg);
    padding: 8px 8px 4px;
    opacity: 0.6;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 6px;
    color: var(--sidebar-fg);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
    margin-bottom: 1px;
    user-select: none;
  }

  .nav-item svg {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    opacity: 0.7;
  }

  .nav-item:hover {
    background: var(--sidebar-hover);
    color: var(--sidebar-fg-active);
  }

  .nav-item:hover svg { opacity: 1; }

  .nav-item.active {
    background: var(--sidebar-active-bg);
    color: var(--sidebar-fg-active);
  }

  .nav-item.active svg { opacity: 1; }

  .nav-badge {
    margin-left: auto;
    background: var(--accent);
    color: var(--accent-fg);
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 99px;
    min-width: 18px;
    text-align: center;
    line-height: 16px;
    height: 16px;
  }

  .sidebar-footer {
    padding: 12px 8px 16px;
    border-top: 1px solid var(--sidebar-border);
  }

  /* ── Main area ── */
  .main {
    flex: 1;
    background: var(--main-bg);
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 100vh;
  }

  /* ── Top bar ── */
  .topbar {
    background: var(--topbar-bg);
    border-bottom: 1px solid var(--topbar-border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
  }

  .topbar-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--fg);
    white-space: nowrap;
    letter-spacing: -0.01em;
  }

  .topbar-date {
    font-size: 12px;
    color: var(--fg-2);
    white-space: nowrap;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-primary {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: var(--accent-fg);
    border: none;
    border-radius: 6px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: opacity 0.1s;
  }

  .btn-primary:hover { opacity: 0.9; }

  .btn-primary svg {
    width: 13px;
    height: 13px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  /* ── Content ── */
  .content {
    padding: 24px;
    flex: 1;
  }

  /* ── Summary row ── */
  .summary-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }

  .summary-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 16px;
    box-shadow: var(--card-shadow);
  }

  .summary-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--fg-2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  .summary-value {
    font-size: 22px;
    font-weight: 700;
    color: var(--fg);
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }

  .summary-sub {
    font-size: 11px;
    color: var(--fg-2);
    margin-top: 4px;
  }

  /* ── Invoice list ── */
  .list-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 12px;
  }

  .list-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--fg-2);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .count-chip {
    background: var(--card-border);
    color: var(--fg-2);
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 99px;
    font-variant-numeric: tabular-nums;
  }

  .list-legend {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--fg-3);
  }

  .legend-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── Invoice card ── */
  .invoice-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .invoice-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: var(--card-shadow);
    display: grid;
    grid-template-columns: auto 1fr auto auto auto;
    align-items: center;
    gap: 12px;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }

  .invoice-card.critical {
    border-color: var(--critical-border);
    background: var(--critical-bg);
  }

  .invoice-card.major {
    border-color: var(--major-border);
    background: var(--major-bg);
  }

  .invoice-card.paid-out {
    opacity: 0;
    transform: translateX(12px);
  }

  /* INV-# ID */
  .inv-id {
    font-size: 11px;
    font-weight: 700;
    color: var(--fg-3);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    white-space: nowrap;
    min-width: 44px;
  }

  /* Severity badge (left of name) */
  .severity-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border-radius: 5px;
    padding: 2px 7px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    letter-spacing: 0.01em;
  }

  .severity-badge .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .badge-critical {
    background: var(--critical-badge-bg);
    color: var(--critical-label);
  }

  .badge-critical .dot { background: var(--critical-label); }

  .badge-major {
    background: var(--major-badge-bg);
    color: var(--major-label);
  }

  .badge-major .dot { background: var(--major-label); }

  .badge-minor {
    background: var(--minor-badge-bg);
    color: var(--minor-label);
  }

  .badge-minor .dot { background: var(--minor-label); }

  /* Invoice info */
  .invoice-info {
    min-width: 0;
  }

  .invoice-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .invoice-customer {
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .invoice-sub {
    font-size: 11px;
    color: var(--fg-2);
    margin-top: 2px;
  }

  /* Days timer badge */
  .timer-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--fg-2);
    background: var(--minor-badge-bg);
    padding: 2px 7px;
    border-radius: 5px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .timer-badge.overdue {
    color: var(--critical-label);
    background: var(--critical-badge-bg);
  }

  .timer-badge svg {
    width: 11px;
    height: 11px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  /* Amount */
  .invoice-amount {
    font-size: 13px;
    font-weight: 700;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-align: right;
    min-width: 90px;
  }

  /* Mark paid button */
  .btn-resolve {
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    color: var(--fg-2);
    font-size: 11px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
    transition: background 0.1s, color 0.1s, border-color 0.1s;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .btn-resolve svg {
    width: 11px;
    height: 11px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }

  .btn-resolve:hover {
    background: #ea580c;
    color: #ffffff;
    border-color: #ea580c;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    color: var(--fg-2);
    padding: 64px 16px;
    border: 1px dashed var(--card-border);
    border-radius: 10px;
    background: var(--card-bg);
  }

  .empty-icon {
    font-size: 32px;
    margin-bottom: 10px;
    display: block;
  }

  .empty-state p {
    font-size: 13px;
    font-weight: 500;
    color: var(--fg-2);
    margin: 0;
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .sidebar { display: none; }

    .topbar { padding: 0 16px; }

    .content { padding: 16px; }

    .summary-row { grid-template-columns: 1fr 1fr; }

    .invoice-card {
      grid-template-columns: auto 1fr auto;
      grid-template-rows: auto auto;
      gap: 8px;
    }

    .inv-id { grid-row: 1; }
    .invoice-info { grid-row: 1; grid-column: 2; }
    .invoice-amount { grid-row: 1; grid-column: 3; min-width: unset; }
    .timer-badge { grid-row: 2; grid-column: 1 / 3; }
    .btn-resolve { grid-row: 2; grid-column: 3; }
    .severity-badge { display: none; }
  }
</style>

<script>
  const csvData = `customer,amount,due_date
Tan Trading,1200,2026-10-01
Lim Florist,450,2026-10-12
Ong Bakery,980,2026-09-25
Koh Events,2300,2026-10-20
Wong Printing,610,2026-10-05
Ng Catering,1750,2026-09-30
Lee Motors,4100,2026-10-08
Teo Logistics,1500,2026-09-28`;

  function parseCSV(text) {
    const [, ...rows] = text.trim().split('\n');
    return rows.map((line, i) => {
      const [customer, amount, due_date] = line.split(',');
      return {
        id: 'inv-' + i,
        num: 'INV-' + String(100 + i).padStart(3, '0'),
        customer: customer.trim(),
        amount: parseFloat(amount),
        due_date: due_date.trim()
      };
    });
  }

  let invoices = parseCSV(csvData);

  function today() {
    const t = new Date(); t.setHours(0, 0, 0, 0); return t;
  }

  function daysLate(dueDateStr) {
    const due = new Date(dueDateStr + 'T00:00:00');
    return Math.floor((today() - due) / 86400000);
  }

  function fmtSGD(n) {
    return 'SGD ' + n.toLocaleString('en-SG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function fmtDate(s) {
    return new Date(s + 'T00:00:00').toLocaleDateString('en-SG', { day: 'numeric', month: 'short' });
  }

  function severity(late) {
    if (late > 30) return 'critical';
    if (late > 14) return 'major';
    return 'minor';
  }

  function severityLabel(late) {
    if (late > 30) return 'Critical';
    if (late > 14) return 'Major';
    return 'Minor';
  }

  function render() {
    const overdue = invoices
      .filter(inv => daysLate(inv.due_date) > 0)
      .sort((a, b) => daysLate(b.due_date) - daysLate(a.due_date));

    const total = overdue.reduce((s, inv) => s + inv.amount, 0);
    const criticals = overdue.filter(inv => daysLate(inv.due_date) > 30);
    const criticalTotal = criticals.reduce((s, inv) => s + inv.amount, 0);
    const avgDays = overdue.length ? Math.round(overdue.reduce((s, inv) => s + daysLate(inv.due_date), 0) / overdue.length) : 0;

    document.getElementById('totalAmount').textContent = fmtSGD(total);
    document.getElementById('invoiceCount').textContent = overdue.length + (overdue.length === 1 ? ' invoice' : ' invoices') + ' overdue';
    document.getElementById('criticalCount').textContent = criticals.length;
    document.getElementById('criticalAmount').textContent = fmtSGD(criticalTotal);
    document.getElementById('avgDays').textContent = avgDays + 'd';
    document.getElementById('listCount').textContent = overdue.length;
    document.getElementById('sidebarCount').textContent = overdue.length;

    const listEl = document.getElementById('invoiceList');
    const emptyEl = document.getElementById('emptyState');
    listEl.innerHTML = '';

    if (overdue.length === 0) {
      emptyEl.hidden = false;
      return;
    }
    emptyEl.hidden = true;

    overdue.forEach(inv => {
      const late = daysLate(inv.due_date);
      const sev = severity(late);
      const sevLabel = severityLabel(late);

      const card = document.createElement('div');
      card.className = 'invoice-card ' + sev;
      card.id = inv.id;

      card.innerHTML = `
        <div class="inv-id">${inv.num}</div>
        <div class="invoice-info">
          <div class="invoice-name-row">
            <span class="severity-badge badge-${sev}">
              <span class="dot"></span>${sevLabel}
            </span>
            <span class="invoice-customer">${inv.customer}</span>
          </div>
          <div class="invoice-sub">Due ${fmtDate(inv.due_date)}</div>
        </div>
        <div class="timer-badge ${late > 30 ? 'overdue' : ''}">
          <svg viewBox="0 0 11 11"><circle cx="5.5" cy="5.5" r="4.5"/><path d="M5.5 3v2.5l1.5 1"/></svg>
          ${late}d late
        </div>
        <div class="invoice-amount">${fmtSGD(inv.amount)}</div>
        <button class="btn-resolve" data-id="${inv.id}">
          <svg viewBox="0 0 11 11"><polyline points="1.5,6 4,8.5 9.5,2.5"/></svg>
          Resolve
        </button>
      `;
      listEl.appendChild(card);
    });

    listEl.querySelectorAll('.btn-resolve').forEach(btn => {
      btn.addEventListener('click', () => markPaid(btn.dataset.id));
    });
  }

  function markPaid(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('paid-out');
    setTimeout(() => {
      invoices = invoices.filter(inv => inv.id !== id);
      render();
    }, 230);
  }

  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-SG', {
    day: 'numeric', month: 'long', year: 'numeric'
  });

  render();
</script>
